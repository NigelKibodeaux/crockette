name: Release

# Runs when a version tag is pushed (`npm version patch && git push --follow-tags`).
# Builds the Mac and Windows zips and publishes them as a GitHub release.
on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

jobs:
    release:
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm

            # mcs (the Mono C# compiler) builds unzipper.exe, and `npm ci` checks for it
            - name: Install Mono
              run: brew install mono

            - run: npm ci

            - run: npm test

            # Builds both the Mac (arm64) zip and the Windows (x64) zip
            - run: npm run build

            - name: Create release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "$GITHUB_REF_NAME" \
                      --title "$GITHUB_REF_NAME" \
                      --generate-notes \
                      out/make/zip/darwin/arm64/*.zip \
                      out/make/zip/win32/x64/*.zip
